<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" lang="ru"/>
        <title>Title</title>
        <link rel="stylesheet" href="styles.css"/>
        <link rel="stylesheet" href="variable.css"/>
        <link rel="stylesheet" href="popup/popup_lib.css"/>
        <script src="script.js"></script>
    </head>
    <body>
        <div class="centerNotification popup" pid="main">
            <span class="notificationTitle"></span>
            <span class="notificationDescription"></span>
            <input type="text" class="notificationPrompt">
            <div class="notificationButtons flex row">
                <span class="notificationButton pointer" id="notificationCancel">Отмена</span>
                <span class="notificationButton pointer" id="notificationOK">ОК</span>
            </div>
        </div>
       
        <div class="windowsMenu flex black row gapm sans-s pointer">
            <div popupstate=false class="black windowsMenuButton popupSwitch" pid=0 animationType=opacity>
                <span>Файл</span>
                <div class="popup" pid=0 style="display:none;">
                    <div class="flex column">
                        <span>Сохранить</span>
                        <span>Экспорт</span>
                    </div>
                </div>
            </div>
            <div class="black windowsMenuButton"><span>Вид</span></div>
            <div class="black windowsMenuButton"><span>Настройки</span></div>
            <div class="black windowsMenuButton"><span>Правка</span></div>
        </div>
        <script src="popup/popup_lib.js"></script>
    </body>
</html>
